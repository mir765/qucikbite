name: QuickBite - Build and Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QuickBite repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking QuickBite project files..."
          ls -la

      - name: Validate landing page
        run: |
          test -f login.html || test -f emi.html
          echo "Landing page HTML found successfully"

      - name: Build QuickBite Docker image
        run: |
          docker build -t quickbite-app .

      - name: Run QuickBite container
        run: |
          docker run -d --name quickbite-test -p 8080:80 quickbite-app

      - name: Test QuickBite website
        run: |
          sleep 3
          curl -f http://localhost:8080
          echo "QuickBite website is working successfully!"

      - name: Stop QuickBite container
        run: |
          docker stop quickbite-test
          docker rm quickbite-test

      - name: Build completed
        run: |
          echo "QuickBite Docker build and test completed successfully!"
